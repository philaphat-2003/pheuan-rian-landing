<!doctype html>
<html lang="th" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- เว็บมีทั้งไทย/อังกฤษในตัวแล้ว: ปิด Google Translate ของเบราว์เซอร์ ไม่ให้แปลทับ (เช่น The crew → ลูกเรือ) -->
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="เพื่อนเรียน แอปฝึกภาษาที่พร้อมลุยไปกับคุณ ฝึกคุยจากสถานการณ์จริง และลองเล่นเกมคำศัพท์ได้ฟรี" />
    <meta name="theme-color" content="#10121c" />
    <script>
      // Apply the saved theme before the page paints. Dark is the initial design.
      ;(() => {
        let theme = 'dark'
        try { if (localStorage.getItem('pheuan-rian:theme') === 'light') theme = 'light' } catch {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#10121c' : '#f5f3ea'
      })()
    </script>
    <title>เพื่อนเรียน — ให้เราเรียนเป็นเพื่อนคุณ</title>
    <link rel="canonical" href="https://pheuan-rian-landing.vercel.app/" />
    <link rel="icon" type="image/webp" href="/brand-mark.webp" />

    <!-- การ์ดพรีวิวตอนแชร์ลิงก์ (LINE / Facebook / X / Discord) — ต้องอยู่ใน HTML จริง ไม่ใช่ใส่ด้วย JS
         ถ้าย้ายไปโดเมนจริง ให้แก้ URL ทั้งหมดในบล็อกนี้ (og:image ต้องเป็น URL เต็ม) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="เพื่อนเรียน · Puean Rian" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://pheuan-rian-landing.vercel.app/" />
    <meta property="og:title" content="เพื่อนเรียน — ให้เราเรียนเป็นเพื่อนคุณ" />
    <meta property="og:description" content="แอปฝึกพูดภาษากับ AI ที่คุยเหมือนเพื่อนสนิท ฝึกจากสถานการณ์จริงวันละไม่กี่นาที และลองเล่นเกมทายคำ Word Jam ได้ฟรีบนเว็บ" />
    <meta property="og:image" content="https://pheuan-rian-landing.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="โลโก้กราฟฟิตี้เพื่อนเรียน กับมาสคอตหนุ่มแว่นโบกมือ" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="เพื่อนเรียน — ให้เราเรียนเป็นเพื่อนคุณ" />
    <meta name="twitter:description" content="แอปฝึกพูดภาษากับ AI ที่คุยเหมือนเพื่อนสนิท ลองเล่นเกมทายคำ Word Jam ได้ฟรีบนเว็บ" />
    <meta name="twitter:image" content="https://pheuan-rian-landing.vercel.app/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,500;0,700;0,900;1,900&family=Sriracha&family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
